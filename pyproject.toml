[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bishal-telco-churn"
version = "2.0.0"
description = "Reproducible customer churn modelling and a Streamlit decision-support dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Bishal Dutta"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["telco_churn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
