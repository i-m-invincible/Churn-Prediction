[theme]
base = "light"
primaryColor = "#167D8D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6F8"
textColor = "#162E40"
font = "sans serif"

[client]
showErrorDetails = "none"

[server]
headless = true
maxUploadSize = 5
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
